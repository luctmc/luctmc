<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Lucas T. M. Castro</title>
  <desc id="heroDesc">Analista desenvolvedor. Inteligencia artificial, full stack e UI/UX. Um wireframe se transforma em interface construida.</desc>

  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .name   { font-size: 54px; font-weight: 700; letter-spacing: -1.4px; fill: #E6EDF3; }
    .role   { font-size: 19px; font-weight: 400; fill: #8B949E; }
    .status { font-size: 14px; font-weight: 500; fill: #8B949E; }

    .wire      { fill: none; stroke: #30363D; stroke-width: 1.5; }
    .wire-dash { fill: none; stroke: #30363D; stroke-width: 1.5; stroke-dasharray: 5 5; }
    .panel     { fill: #161B22; stroke: #30363D; stroke-width: 1.5; }
    .rule      { stroke: #30363D; stroke-width: 1.5; }
    .block     { fill: #30363D; }
    .block-2   { fill: #8B949E; }
    .accent    { fill: #FFFFFF; }
    .accent-2  { fill: #F5A97F; }

    /* Tema claro: a mesma arte, recolorida. Sem duplicar URLs por tema. */
    @media (prefers-color-scheme: light) {
      .name   { fill: #1F2328; }
      .role,
      .status { fill: #59636E; }
      .wire,
      .wire-dash { stroke: #D0D7DE; }
      .panel  { fill: #F0F3F6; stroke: #D0D7DE; }
      .rule   { stroke: #D0D7DE; }
      .block  { fill: #D0D7DE; }
      .block-2{ fill: #59636E; }
      .accent { fill: #1F2328; }
      .accent-2 { fill: #B85C36; }
    }

    /* O único movimento da página: wireframe -> interface construída. */
    .sweep { width: 545px; animation: wipe 9s cubic-bezier(.65, 0, .35, 1) infinite; }
    @keyframes wipe {
      0%, 8%   { width: 0px; }
      42%, 88% { width: 545px; }
      100%     { width: 0px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sweep { animation: none; width: 545px; }
    }
  </style>

  <defs>
    <clipPath id="reveal">
      <rect class="sweep" x="635" y="0" width="545" height="280" />
    </clipPath>
  </defs>

  <text class="t name" x="40" y="130">Lucas T. M. Castro</text>
  <text class="t role" x="42" y="166">Analista desenvolvedor. IA, full stack e UI/UX.</text>
  <circle class="accent" cx="48" cy="197" r="5" />
  <text class="t status" x="64" y="202">Jundiaí, SP. Aberto a novos projetos.</text>

  <g>
    <rect class="wire-dash" x="660" y="44" width="440" height="196" rx="12" />
    <line class="wire-dash" x1="744" y1="44" x2="744" y2="240" />
    <rect class="wire" x="676" y="72" width="52" height="8" rx="4" />
    <rect class="wire" x="676" y="94" width="52" height="8" rx="4" />
    <rect class="wire" x="676" y="116" width="52" height="8" rx="4" />
    <rect class="wire" x="676" y="138" width="52" height="8" rx="4" />
    <rect class="wire" x="768" y="68" width="170" height="14" rx="7" />
    <rect class="wire" x="768" y="92" width="110" height="8" rx="4" />
    <rect class="wire" x="768" y="118" width="98" height="56" rx="8" />
    <rect class="wire" x="878" y="118" width="98" height="56" rx="8" />
    <rect class="wire" x="988" y="118" width="98" height="56" rx="8" />
    <rect class="wire" x="768" y="192" width="250" height="8" rx="4" />
    <rect class="wire" x="768" y="208" width="180" height="8" rx="4" />
    <rect class="wire-dash" x="1078" y="120" width="82" height="140" rx="14" />
    <rect class="wire" x="1092" y="140" width="54" height="6" rx="3" />
    <rect class="wire" x="1092" y="154" width="40" height="6" rx="3" />
    <rect class="wire" x="1092" y="172" width="54" height="40" rx="6" />
    <rect class="wire" x="1092" y="222" width="54" height="6" rx="3" />
  </g>

  <g clip-path="url(#reveal)">
    <rect class="panel" x="660" y="44" width="440" height="196" rx="12" />
    <line class="rule" x1="744" y1="44" x2="744" y2="240" />
    <rect class="block" x="676" y="72" width="52" height="8" rx="4" />
    <rect class="block" x="676" y="94" width="52" height="8" rx="4" />
    <rect class="accent-2" x="676" y="116" width="52" height="8" rx="4" />
    <rect class="block" x="676" y="138" width="52" height="8" rx="4" />
    <rect class="block-2" x="768" y="68" width="170" height="14" rx="7" />
    <rect class="block" x="768" y="92" width="110" height="8" rx="4" />
    <rect class="block" x="768" y="118" width="98" height="56" rx="8" />
    <rect class="block" x="878" y="118" width="98" height="56" rx="8" />
    <rect class="block" x="988" y="118" width="98" height="56" rx="8" />
    <rect class="accent" x="768" y="118" width="98" height="4" rx="2" />
    <rect class="block" x="768" y="192" width="250" height="8" rx="4" />
    <rect class="block" x="768" y="208" width="180" height="8" rx="4" />
    <rect class="panel" x="1078" y="120" width="82" height="140" rx="14" />
    <rect class="block" x="1092" y="140" width="54" height="6" rx="3" />
    <rect class="block" x="1092" y="154" width="40" height="6" rx="3" />
    <rect class="block" x="1092" y="172" width="54" height="40" rx="6" />
    <rect class="accent" x="1092" y="222" width="54" height="6" rx="3" />
  </g>
</svg>
