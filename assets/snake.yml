# Salve este arquivo em .github/workflows/snake.yml no repositório luctmc/luctmc
# Depois rode uma vez em Actions > Generate snake > Run workflow.

name: Generate snake

on:
  schedule:
    - cron: "0 3 * * *"   # 00h em Brasília
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar animação
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=%232FA898&color_dots=%23ebedf0,%23c7e4de,%2392cfc4,%235cb8a9,%232FA898
            dist/snake-dark.svg?palette=github-dark&color_snake=%234DD4C0&color_dots=%23151b23,%231e3a35,%232f6d61,%233fa694,%234DD4C0

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
