# Salve este arquivo em .github/workflows/snake.yml no repositório luctmc/luctmc
# Depois rode uma vez em Actions > Generate snake > Run workflow.

name: Generate snake

on:
  schedule:
    - cron: "0 3 * * *"   # 00h em Brasília
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar animação
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=%231F2328&color_dots=%23ebedf0,%23c9ced4,%238c959f,%2357606a,%231F2328
            dist/snake-dark.svg?palette=github-dark&color_snake=%23FFFFFF&color_dots=%23151b23,%233d444d,%236e7681,%23b1bac4,%23FFFFFF

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

